name: Compiler or platform portability
description: Report a library build, ABI, compiler, libc, or target-platform problem.
title: "[Portability] "
body:
  - type: input
    id: version
    attributes:
      label: wolf3d-lib version or commit
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target environment
      description: OS, CPU architecture, ABI, and runtime or libc where applicable.
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Build command or IDE configuration
      render: shell
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure output
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Note whether this is a documented support target or a proposed new port.
